                          <div className="flex items-center gap-2">
                            <h4 className="text-xs font-bold text-white">Active Residential Station</h4>
                            <span className="text-[10px] text-emerald-400 bg-emerald-500/10 border border-emerald-500/30 px-2 py-0.5 rounded font-mono font-bold">
                              Host: {myActiveStation.hostName}
                            </span>
                          </div>
                          <p className="text-[11px] text-slate-300 mt-1 flex items-center gap-1.5">
                            <i className="fa-solid fa-location-dot text-rose-400 text-xs"></i>
                            <span>{myActiveStation.address}, {myActiveStation.city}</span>
                          </p>
                          <p className="text-[10px] text-slate-400 mt-0.5 flex items-center gap-1.5">
                            <i className="fa-solid fa-phone text-cyan-400 text-[10px]"></i>
                            <span>{myActiveStation.hostPhone}</span>
                          </p>
                        </div>
                        <span className="text-sm font-extrabold text-emerald-400 font-mono">₹{myActiveStation.pricePerHour} / hr</span>
                      </div>

                      <div className="grid grid-cols-2 gap-2 text-[11px] text-slate-300 pt-2 border-t border-[#1E293B]">
                        <div>Socket: <strong>{myActiveStation.socketType}</strong></div>
                        <div>Parking: <strong>{myActiveStation.parkingType}</strong></div>
                        <div>Hours: <strong>{myActiveStation.availableHours}</strong></div>
                        <div>Status: <strong className="text-emerald-400">● Live & Accepting Bookings</strong></div>
                      </div>
                    </div>
                  </div>

                  {/* Add New Listing Form (6 Cols) */}
                  <div className="lg:col-span-6 bg-[#0F151C] border border-[#1E293B] p-5 rounded-2xl shadow-xl space-y-3">
                    <div className="flex justify-between items-center pb-2 border-b border-[#1E293B]">
                      <h3 className="text-sm font-bold text-white flex items-center gap-2">
                        <i className="fa-solid fa-plus-circle text-emerald-400"></i>
                        List a New Home Charger (Any City in India)
                      </h3>
                      <span className="text-[10px] text-cyan-400 font-mono bg-cyan-500/10 px-2 py-0.5 rounded border border-cyan-500/20">
                        P2P Host Listing
                      </span>
                    </div>
                    
                    <form onSubmit={(e) => {
                      e.preventDefault();
                      const hostName = e.target.chHostName.value.trim() || userProfile.name || "Ayush Chauhan";
                      const hostPhone = e.target.chHostPhone.value.trim() || "+91 98101 23456";
                      const address = e.target.chAddress.value;
                      const city = e.target.chCity.value;
                      const socket = e.target.chSocket.value;
                      const price = Number(e.target.chPrice.value) || 60;
                      
                      const newCh = {
                        id: "ch-" + Date.now(),
                        hostName: hostName,
                        hostPhone: hostPhone,
                        hostRating: 5.0,
                        verifiedHost: true,
                        address: address,
                        city: city,
                        mapX: 45 + Math.floor(Math.random() * 25),
                        mapY: 40 + Math.floor(Math.random() * 25),
                        distanceKm: 1.5,
                        socketType: socket,
                        vehicleSupport: socket.includes("15A") ? ["2-Wheeler (Scooter)", "2-Wheeler (Bike)", "3-Wheeler (Commercial)"] : ["4-Wheeler (Car)"],
                        powerKw: socket.includes("15A") ? 3.3 : (socket.includes("11") ? 11.0 : 7.4),
                        pricePerHour: price,
                        pricePerUnit: Math.round(price / 3.5),
                        parkingType: "Residential Garage / Dedicated Bay",
                        amenities: ["CCTV", "Drinking Water", "Wi-Fi"],
                        availableDays: "All Days",
                        availableHours: "08:00 AM - 09:00 PM",
                        bookedSlots: [],
                        image: "https://images.unsplash.com/photo-1593941707882-a5bba14938c7?w=600&auto=format&fit=crop&q=80"
                      };

                      setChargers(prev => [newCh, ...prev]);
                      setUserProfile(prev => ({ ...prev, name: hostName }));
                      setMyActiveStation({
                        hostName: hostName,
                        hostPhone: hostPhone,
                        address: address,
                        city: city,
                        pricePerHour: price,
                        socketType: socket,
                        parkingType: "Residential Garage / Dedicated Bay",
                        powerKw: socket.includes("15A") ? 3.3 : (socket.includes("11") ? 11.0 : 7.4),
                        availableHours: "08:00 AM - 09:00 PM"
                      });
                      showToast(`🎉 Charger published by Host: "${hostName}" in ${city}!`);
                      e.target.reset();
                    }} className="space-y-3 text-xs">
                      
                      {/* Host Name & Contact Details Highlight Box */}
                      <div className="bg-gradient-to-r from-cyan-950/40 via-[#141C26] to-emerald-950/30 border border-cyan-500/40 p-3.5 rounded-xl space-y-2.5 shadow-md">
                        <div className="text-[11px] font-bold text-cyan-300 flex items-center gap-1.5">
                          <i className="fa-solid fa-address-card text-emerald-400"></i>
                          <span>Host Information (होस्ट की जानकारी):</span>
                        </div>

                        <div className="grid grid-cols-1 sm:grid-cols-2 gap-3">
                          <div>
                            <label className="block text-white mb-1 font-bold flex items-center gap-1.5">
                              <i className="fa-solid fa-user text-cyan-400"></i> Host Name (होस्ट का नाम) *
                            </label>
                            <input
                              name="chHostName"
                              type="text"
                              required
                              defaultValue={userProfile.name}
                              placeholder="e.g. Ayush Chauhan, Rajesh Sharma"
                              className="w-full bg-[#0B0F14] border border-cyan-500/60 rounded-xl p-2.5 text-white focus:outline-none focus:border-emerald-400 font-bold text-xs"
                            />
                          </div>

                          <div>
                            <label className="block text-white mb-1 font-bold flex items-center gap-1.5">
                              <i className="fa-solid fa-phone text-emerald-400"></i> Host Phone / WhatsApp *
                            </label>
                            <input
                              name="chHostPhone"
                              type="tel"
                              required
                              defaultValue="+91 98101 23456"
                              placeholder="+91 98XXX XXXXX"
                              className="w-full bg-[#0B0F14] border border-cyan-500/60 rounded-xl p-2.5 text-white focus:outline-none focus:border-emerald-400 font-mono text-xs"
                            />
                          </div>
                        </div>
                      </div>

                      <div className="grid grid-cols-2 gap-3">
                        <div>
                          <label className="block text-slate-400 mb-1 font-medium">City in India *</label>
                          <select name="chCity" className="w-full bg-[#141C26] border border-[#223043] rounded-xl p-2.5 text-white focus:outline-none">
                            {CITIES.filter(c => c !== "All India (Pan-India Grid)").map(c => (
                              <option key={c} value={c}>{c}</option>
                            ))}
                          </select>
                        </div>
                        <div>
                          <label className="block text-slate-400 mb-1 font-medium">Hourly Rate (₹) *</label>
                          <input
                            name="chPrice"
                            type="number"
                            defaultValue="60"
                            required
                            className="w-full bg-[#141C26] border border-[#223043] rounded-xl p-2.5 text-white focus:outline-none font-mono"
                          />
                        </div>
                      </div>

                      <div>
                        <label className="block text-slate-400 mb-1 font-medium">House / Apartment Address *</label>
                        <input
                          name="chAddress"
                          type="text"
                          required
                          placeholder="e.g. Flat 102, Sector 18, Noida / Bandra West, Mumbai"
                          className="w-full bg-[#141C26] border border-[#223043] rounded-xl p-2.5 text-white focus:outline-none focus:border-emerald-500"
                        />
                      </div>

                      <div>
                        <label className="block text-slate-400 mb-1 font-medium">Socket Type *</label>
                        <select name="chSocket" className="w-full bg-[#141C26] border border-[#223043] rounded-xl p-2.5 text-white focus:outline-none">
                          <option value="Type-2 AC (7.4 kW)">Type-2 AC (7.4 kW) — Cars</option>
                          <option value="15A Industrial Socket (3.3 kW)">15A Industrial Socket (3.3 kW) — 2W Scooters & Bikes</option>
                          <option value="Type-2 AC (11 kW Fast AC)">Type-2 AC (11 kW Fast AC) — Premium Cars</option>
                        </select>
                      </div>

                      <button
                        type="submit"
                        className="w-full bg-emerald-600 hover:bg-emerald-500 text-white font-semibold py-2.5 rounded-xl transition mt-2 shadow-lg shadow-emerald-600/20 flex items-center justify-center gap-2"
                      >
                        <i className="fa-solid fa-cloud-arrow-up"></i>
                        <span>Publish Charger to Pan-India Map</span>
                      </button>
                    </form>
                  </div>

                </div>

              </div>
            )}

            {/* ==================================================== */}
            {/* 3. SUPER ADMIN CONTROL ROOM                          */}
            {/* ==================================================== */}
            {userRole === "admin" && (
              <div className="space-y-6">
                <div className="bg-[#0F151C] border border-[#1E293B] p-5 rounded-2xl shadow-xl space-y-4">
                  <div className="flex justify-between items-center pb-3 border-b border-[#1E293B]">
                    <div>
                      <h3 className="text-sm font-bold text-white">Pan-India Super Admin Control Room</h3>
                      <p className="text-xs text-slate-400">National grid monitoring, host KYC verification & 10% platform commission audit.</p>
                    </div>
                    <span className="text-xs font-mono bg-indigo-500/20 text-indigo-300 border border-indigo-500/30 px-2.5 py-1 rounded">
                      Platform Fee: 10%
                    </span>
                  </div>

                  <div className="overflow-x-auto">
                    <table className="w-full text-xs text-left text-slate-300">
                      <thead className="bg-[#141C26] text-slate-400 border-b border-[#223043] uppercase text-[10px] font-mono">
                        <tr>
                          <th className="p-3">Host Name</th>
                          <th className="p-3">City</th>
                          <th className="p-3">Address</th>
                          <th className="p-3">Socket Specs</th>
                          <th className="p-3">Tariff</th>
                          <th className="p-3">Status</th>
                        </tr>
                      </thead>
                      <tbody className="divide-y divide-[#1E293B]">
                        {chargers.map(ch => (
                          <tr key={ch.id} className="hover:bg-[#121922]">
                            <td className="p-3 font-semibold text-white">{ch.hostName}</td>
                            <td className="p-3 font-mono text-cyan-400">{ch.city}</td>
                            <td className="p-3 max-w-xs truncate">{ch.address}</td>
                            <td className="p-3 font-mono text-slate-300">{ch.socketType}</td>
                            <td className="p-3 font-bold text-emerald-400">₹{ch.pricePerHour}/hr</td>
                            <td className="p-3">
                              <span className="bg-emerald-500/10 text-emerald-300 px-2 py-0.5 rounded text-[10px] border border-emerald-500/30">
                                Verified Host
                              </span>
                            </td>
                          </tr>
                        ))}
                      </tbody>
                    </table>
                  </div>
                </div>

                {/* REGISTERED USERS DIRECTORY (NEW REGISTRATIONS IN REAL TIME) */}
                <div className="bg-[#0F151C] border border-[#1E293B] p-5 rounded-2xl shadow-xl space-y-4">
                  <div className="flex flex-col sm:flex-row sm:items-center justify-between gap-2 pb-3 border-b border-[#1E293B]">
                    <div>
                      <h3 className="text-sm font-bold text-white flex items-center gap-2">
                        <i className="fa-solid fa-users-gear text-cyan-400"></i>
                        <span>Pan-India Registered Users Directory (रजिस्टर्ड ग्राहक एवं होस्ट)</span>
                      </h3>
                      <p className="text-xs text-slate-400">All registered users verified with mobile OTP across India.</p>
                    </div>
                    <span className="text-xs font-mono bg-cyan-500/20 text-cyan-300 border border-cyan-500/30 px-2.5 py-1 rounded">
                      Total Registered: {registeredUsers.length} Users
                    </span>
                  </div>

                  <div className="overflow-x-auto">
                    <table className="w-full text-xs text-left text-slate-300">
                      <thead className="bg-[#141C26] text-slate-400 border-b border-[#223043] uppercase text-[10px] font-mono">
                        <tr>
                          <th className="p-3">User Full Name</th>
                          <th className="p-3">Account Role</th>
                          <th className="p-3">Mobile Number</th>
                          <th className="p-3">Registered City</th>
                          <th className="p-3">Email Address</th>
                          <th className="p-3">Status</th>
                        </tr>
                      </thead>
                      <tbody className="divide-y divide-[#1E293B]">
                        {registeredUsers.map(u => (
                          <tr key={u.id} className="hover:bg-[#121922]">
                            <td className="p-3 font-semibold text-white flex items-center gap-2">
                              <div className="w-6 h-6 rounded-full bg-emerald-500/20 text-emerald-300 font-bold flex items-center justify-center text-[10px]">
                                {(u.firstName || "U")[0].toUpperCase()}
                              </div>
                              <span>{u.firstName} {u.lastName}</span>
                            </td>
                            <td className="p-3">
                              <span className={`px-2 py-0.5 rounded text-[10px] font-bold ${
                                u.role === 'host'
                                  ? 'bg-cyan-500/20 text-cyan-300 border border-cyan-500/30'
                                  : 'bg-emerald-500/20 text-emerald-300 border border-emerald-500/30'
                              }`}>
                                {u.role === 'host' ? 'Residential Host' : 'Customer (Driver)'}
                              </span>
                            </td>
                            <td className="p-3 font-mono text-white">+91 {u.phone}</td>
                            <td className="p-3 font-mono text-cyan-400">{u.city}</td>
                            <td className="p-3 text-slate-400">{u.email}</td>
                            <td className="p-3">
                              <span className="bg-emerald-500/10 text-emerald-400 border border-emerald-500/30 px-2 py-0.5 rounded text-[10px] flex items-center gap-1 w-fit">
                                <i className="fa-solid fa-mobile-screen-button text-[9px]"></i> OTP Verified
                              </span>
                            </td>
                          </tr>
                        ))}
                      </tbody>
                    </table>
                  </div>
                </div>

              </div>
            )}

          </main>

          {/* ==================================================== */}
          {/* BOOKING MODAL (ANTI-CLASH SLOT SELECTION)            */}
          {/* ==================================================== */}
          {isBookingModalOpen && selectedCharger && (
            <div className="fixed inset-0 z-50 flex items-center justify-center p-3 sm:p-4 bg-black/80 backdrop-blur-sm">
              <div className="bg-[#0F151C] border border-[#1E293B] max-w-lg w-full max-h-[92vh] overflow-y-auto rounded-2xl p-4 sm:p-5 shadow-2xl space-y-4">
                
                <div className="flex justify-between items-start pb-3 border-b border-[#1E293B]">
                  <div>
                    <h3 className="text-sm font-bold text-white">Reserve Charging Slot</h3>
                    <p className="text-xs text-slate-400">{selectedCharger.hostName}'s Station ({selectedCharger.city})</p>
                  </div>
                  <button onClick={() => setIsBookingModalOpen(false)} className="text-slate-400 hover:text-white">
                    <i className="fa-solid fa-xmark"></i>
                  </button>
                </div>

                {/* Vehicle Compatibility Banner in Booking Modal */}
                <div className="bg-[#141C26] border border-emerald-500/30 p-3 rounded-xl flex items-center justify-between text-xs">
                  <div>
                    <span className="text-[10px] text-slate-400 block">Booking for:</span>
                    <span className="font-bold text-white">{selectedVehicleModel.name}</span>
                  </div>
                  <span className="text-[11px] font-mono text-emerald-400 bg-emerald-500/10 px-2 py-0.5 rounded border border-emerald-500/30">
                    Matches: {selectedCharger.socketType}
                  </span>
                </div>

                {/* Date Selection */}
                <div>
                  <label className="block text-xs font-semibold text-slate-300 mb-2">Select Date:</label>
                  <div className="grid grid-cols-3 gap-2 text-xs">
                    {["Today", "Tomorrow", "Day After"].map(d => (
                      <button
                        key={d}
                        onClick={() => setBookingDate(d)}
                        className={`py-2 rounded-xl border text-center font-medium transition ${
                          bookingDate === d
                            ? "bg-emerald-600 border-emerald-500 text-white shadow"
                            : "bg-[#141C26] border-[#223043] text-slate-300 hover:border-slate-500"
                        }`}
                      >
                        {d}
                      </button>
                    ))}
                  </div>
                </div>

                {/* Anti-Clash Time Slots Grid */}
                <div>
                  <div className="flex justify-between items-center mb-2">
                    <label className="text-xs font-semibold text-slate-300">Available Time Windows:</label>
                    <span className="text-[10px] text-slate-400">Anti-Clash Protected</span>
                  </div>

                  <div className="grid grid-cols-2 gap-2 text-xs">
                    {TIME_SLOTS.map(slot => {
                      const isBooked = selectedCharger.bookedSlots.includes(slot);
                      return (
                        <button
                          key={slot}
                          disabled={isBooked}
                          onClick={() => setSelectedSlot(slot)}
                          className={`p-2.5 rounded-xl border text-left flex items-center justify-between transition ${
                            isBooked
                              ? "bg-rose-950/20 border-rose-900/30 text-rose-400 opacity-60 cursor-not-allowed"
                              : selectedSlot === slot
                              ? "bg-cyan-600 border-cyan-500 text-white shadow-md shadow-cyan-600/30"
                              : "bg-[#141C26] border-[#223043] text-slate-200 hover:border-cyan-500/50"
                          }`}
                        >
                          <span className="font-mono text-[11px]">{slot}</span>
                          {isBooked ? (
                            <span className="text-[9px] uppercase font-bold text-rose-400">Booked</span>
                          ) : (
                            <i className={`fa-solid ${selectedSlot === slot ? 'fa-circle-check text-white' : 'fa-circle-plus text-slate-500'}`}></i>
                          )}
                        </button>
                      );
                    })}
                  </div>
                </div>

                {/* Pricing Summary */}
                <div className="bg-[#141C26] border border-[#223043] p-3.5 rounded-xl text-xs space-y-1.5">
                  <div className="flex justify-between text-slate-300">
                    <span>2 Hours Session (@ ₹{selectedCharger.pricePerHour}/hr):</span>
                    <span className="font-mono">₹{selectedCharger.pricePerHour * 2}</span>
                  </div>
                  <div className="flex justify-between text-slate-400 text-[11px]">
                    <span>Platform Service & Green Energy Fee:</span>
                    <span className="font-mono">₹15</span>
                  </div>
                  <div className="pt-2 border-t border-[#1E293B] flex justify-between font-bold text-sm text-white">
                    <span>Total Amount Payable:</span>
                    <span className="text-emerald-400 font-mono">₹{selectedCharger.pricePerHour * 2 + 15}</span>
                  </div>
                </div>

                <button
                  onClick={handleConfirmBooking}
                  className="w-full bg-gradient-to-r from-emerald-600 to-emerald-500 hover:from-emerald-500 hover:to-emerald-600 text-white py-3 rounded-xl font-bold text-xs transition flex items-center justify-center gap-2 shadow-lg shadow-emerald-600/30"
                >
                  <i className="fa-solid fa-lock"></i>
                  <span>Pay & Lock Reservation (Generate OTP)</span>
                </button>
              </div>
            </div>
          )}

          {/* ==================================================== */}
          {/* DIGITAL RECEIPT & INVOICE POPUP                      */}
          {/* ==================================================== */}
          {activeInvoice && (
            <div className="fixed inset-0 z-50 flex items-center justify-center p-3 sm:p-4 bg-black/80 backdrop-blur-sm">
              <div className="bg-[#0F151C] border border-emerald-500/40 max-w-md w-full max-h-[92vh] overflow-y-auto rounded-2xl p-4 sm:p-6 shadow-2xl space-y-4 glow-emerald">
                <div className="flex justify-between items-start pb-3 border-b border-[#1E293B]">
                  <div className="flex items-center gap-2">
                    <div className="w-8 h-8 rounded-lg bg-emerald-500/20 text-emerald-400 flex items-center justify-center">
                      <i className="fa-solid fa-bolt"></i>
                    </div>
                    <div>
                      <h4 className="text-sm font-bold text-white">EV-Share Tax Invoice</h4>
                      <span className="text-[10px] font-mono text-slate-400">Ref: {activeInvoice.id}</span>
                    </div>
                  </div>
                  <button onClick={() => setActiveInvoice(null)} className="text-slate-400 hover:text-white">
                    <i className="fa-solid fa-xmark"></i>
                  </button>
                </div>

                <div className="text-center py-2 bg-emerald-950/40 border border-emerald-500/30 rounded-xl">
                  <div className="text-[10px] text-emerald-300 uppercase tracking-wider font-semibold">Your Check-In OTP Code</div>
                  <div className="text-3xl font-extrabold text-white font-mono tracking-widest my-1">{activeInvoice.otp}</div>
                  <div className="text-[10px] text-slate-400">Host ke ghar pahunch kar yeh OTP bataayein</div>
                </div>

                <div className="space-y-2 text-xs text-slate-300 bg-[#141C26] p-3 rounded-xl border border-[#223043]">
                  <div className="flex justify-between">
                    <span className="text-slate-400">Host Station:</span>
                    <span className="font-semibold text-right max-w-[200px] truncate">{activeInvoice.chargerName}</span>
                  </div>
                  <div className="flex justify-between">
                    <span className="text-slate-400">City:</span>
                    <span className="font-mono text-emerald-400">{activeInvoice.city || 'India'}</span>
                  </div>
                  <div className="flex justify-between">
                    <span className="text-slate-400">Date & Slot:</span>
                    <span className="font-mono">{activeInvoice.date}, {activeInvoice.timeSlot}</span>
                  </div>
                  <div className="flex justify-between">
                    <span className="text-slate-400">Socket Protocol:</span>
                    <span className="font-mono text-cyan-400">{activeInvoice.socketType}</span>
                  </div>
                  <div className="flex justify-between">
                    <span className="text-slate-400">Host Phone:</span>
                    <span className="font-mono">{activeInvoice.hostPhone}</span>
                  </div>
                  <div className="pt-2 border-t border-[#1E293B] flex justify-between font-bold text-white">
                    <span>Total Paid:</span>
                    <span className="text-emerald-400 font-mono">₹{activeInvoice.amountPaid}</span>
                  </div>
                </div>

                <div className="flex gap-2">
                  <button
                    onClick={() => {
                      window.print();
                    }}
                    className="flex-1 bg-[#192231] hover:bg-[#222E42] text-white py-2 rounded-xl text-xs font-semibold transition flex items-center justify-center gap-1.5 border border-[#2B3B52]"
                  >
                    <i className="fa-solid fa-print"></i> Print Invoice
                  </button>
                  <button
                    onClick={() => setActiveInvoice(null)}
                    className="flex-1 bg-emerald-600 hover:bg-emerald-500 text-white py-2 rounded-xl text-xs font-semibold transition"
                  >
                    Close & Done
                  </button>
                </div>
              </div>
            </div>
          )}

        </div>
      );
    }

    ReactDOM.render(<App />, document.getElementById("root"));
  </script>
</body>
</html>
