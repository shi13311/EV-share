    };

    function getChargerCoordinates(ch) {
      if (ch.lat && ch.lng) return { lat: ch.lat, lng: ch.lng };
      const cityCenter = CITY_COORDINATES[ch.city] || CITY_COORDINATES["Delhi-NCR"];
      const offsetX = ((ch.mapX || 50) - 50) * 0.0035;
      const offsetY = ((ch.mapY || 50) - 50) * 0.0035;
      return {
        lat: cityCenter.lat + offsetY,
        lng: cityCenter.lng + offsetX
      };
    }

    // Leaflet Interactive Map Component
    function LeafletChargerMap({ chargers, selectedCharger, onSelectCharger, activeCity, userLocation }) {
      const mapContainerRef = React.useRef(null);
      const mapInstanceRef = React.useRef(null);
      const markersLayerRef = React.useRef(null);

      React.useEffect(() => {
        if (!mapContainerRef.current || typeof L === 'undefined') return;

        if (!mapInstanceRef.current) {
          const defaultCenter = CITY_COORDINATES[activeCity] || CITY_COORDINATES["Delhi-NCR"];
          const map = L.map(mapContainerRef.current, {
            center: [defaultCenter.lat, defaultCenter.lng],
            zoom: defaultCenter.zoom,
            zoomControl: false
          });

          L.control.zoom({ position: 'bottomright' }).addTo(map);

          L.tileLayer('https://{s}.basemaps.cartocdn.com/rastertiles/voyager/{z}/{x}/{y}{r}.png', {
            attribution: '&copy; OpenStreetMap contributors &copy; CARTO',
            maxZoom: 19
          }).addTo(map);

          markersLayerRef.current = L.layerGroup().addTo(map);
          mapInstanceRef.current = map;
        }

        const map = mapInstanceRef.current;
        const markersLayer = markersLayerRef.current;
        markersLayer.clearLayers();

        if (userLocation) {
          const userIcon = L.divIcon({
            className: 'user-pin-icon',
            html: '<div class="relative flex items-center justify-center w-8 h-8"><span class="absolute w-8 h-8 bg-cyan-400 rounded-full animate-ping opacity-75"></span><span class="relative flex items-center justify-center w-6 h-6 bg-cyan-500 text-white rounded-full shadow-lg border-2 border-white"><i class="fa-solid fa-location-crosshairs text-xs"></i></span></div>',
            iconSize: [32, 32],
            iconAnchor: [16, 16]
          });
          L.marker([userLocation.lat, userLocation.lng], { icon: userIcon })
            .bindPopup('<b style="color:#06B6D4;">Your Current Location</b><br>Searching chargers within radius')
            .addTo(markersLayer);
        }

        chargers.forEach(ch => {
          const coords = getChargerCoordinates(ch);
          const status = ch.status || 'Available';
          let pulseColor = 'bg-emerald-400';
          let dotColor = 'bg-emerald-500';
          let statusBadge = '<span class="px-1.5 py-0.5 rounded text-[10px] font-bold bg-emerald-950 text-emerald-300 border border-emerald-800">Available</span>';

          if (status === 'Busy' || status === 'In Use') {
            pulseColor = 'bg-amber-400';
            dotColor = 'bg-amber-500';
            statusBadge = '<span class="px-1.5 py-0.5 rounded text-[10px] font-bold bg-amber-950 text-amber-300 border border-amber-800">In Use</span>';
          } else if (status === 'Offline') {
            pulseColor = 'bg-rose-400';
            dotColor = 'bg-rose-500';
            statusBadge = '<span class="px-1.5 py-0.5 rounded text-[10px] font-bold bg-rose-950 text-rose-300 border border-rose-800">Offline</span>';
          }

          const isSelected = selectedCharger && selectedCharger.id === ch.id;

          const markerHtml = `<div class="relative flex items-center justify-center cursor-pointer group transition-transform ${isSelected ? 'scale-125 z-50' : 'hover:scale-110'}">
            <span class="absolute w-7 h-7 ${pulseColor} rounded-full animate-ping opacity-60"></span>
            <div class="relative flex items-center justify-center w-7 h-7 ${dotColor} text-white rounded-full shadow-xl border-2 ${isSelected ? 'border-yellow-300 ring-4 ring-yellow-400/50' : 'border-slate-900'} text-xs font-bold">
              <i class="fa-solid fa-bolt text-[10px]"></i>
            </div>
            <div class="absolute -bottom-4 whitespace-nowrap bg-slate-900/90 text-white text-[9px] font-mono font-semibold px-1.5 py-0.5 rounded shadow border border-slate-700">
              ₹${ch.pricePerHour}/hr
            </div>
          </div>`;

          const customIcon = L.divIcon({
            className: 'charger-pin-icon',
            html: markerHtml,
            iconSize: [28, 28],
            iconAnchor: [14, 14]
          });

          const marker = L.marker([coords.lat, coords.lng], { icon: customIcon });

          const popupContent = `
            <div class="p-1 min-w-[210px] text-slate-200">
              <div class="flex items-center justify-between gap-2 mb-1.5">
                <span class="font-bold text-xs text-white truncate">${ch.hostName}'s Station</span>
                ${statusBadge}
              </div>
              <p class="text-[11px] text-slate-400 mb-2 leading-tight flex items-start gap-1">
                <i class="fa-solid fa-location-dot text-emerald-400 mt-0.5"></i>
                <span class="line-clamp-2">${ch.address}</span>
              </p>
              <div class="flex items-center justify-between text-[11px] font-mono bg-slate-800/80 p-1.5 rounded-lg border border-slate-700/60 mb-2.5">
                <span class="text-slate-300">${ch.socketType.split('(')[0]}</span>
                <span class="text-emerald-400 font-bold">₹${ch.pricePerHour}/hr</span>
              </div>
              <button id="map-popup-btn-${ch.id}" class="w-full bg-emerald-500 hover:bg-emerald-600 text-slate-950 font-bold text-xs py-1.5 px-3 rounded-lg shadow-md transition flex items-center justify-center gap-1.5">
                <i class="fa-solid fa-calendar-check"></i> View & Book Station
              </button>
            </div>
          `;

          marker.bindPopup(popupContent);

          marker.on('click', () => {
            onSelectCharger(ch);
          });

          marker.on('popupopen', () => {
            const btn = document.getElementById(`map-popup-btn-${ch.id}`);
            if (btn) {
              btn.onclick = () => {
                onSelectCharger(ch);
              };
            }
          });

          marker.addTo(markersLayer);
        });

        if (selectedCharger) {
          const coords = getChargerCoordinates(selectedCharger);
          map.flyTo([coords.lat, coords.lng], 14, { duration: 1.0 });
        } else if (CITY_COORDINATES[activeCity]) {
          const cityCenter = CITY_COORDINATES[activeCity];
          map.flyTo([cityCenter.lat, cityCenter.lng], cityCenter.zoom, { duration: 0.8 });
        }
      }, [chargers, selectedCharger, activeCity, userLocation]);

      return (
        <div className="relative w-full h-full min-h-[380px] lg:min-h-[640px] rounded-2xl overflow-hidden border border-slate-800 shadow-2xl bg-slate-950">
          <div ref={mapContainerRef} className="w-full h-full z-0" style={{ minHeight: '100%', height: '100%' }} />
          
          <div className="absolute top-3 left-3 z-[400] bg-slate-900/90 backdrop-blur-md border border-slate-700/80 px-3 py-2 rounded-xl shadow-xl flex items-center gap-3 text-xs">
            <div className="flex items-center gap-1.5">
              <span className="w-2.5 h-2.5 rounded-full bg-emerald-500 shadow-sm shadow-emerald-500/50"></span>
              <span className="text-slate-300 font-medium">Available</span>
            </div>
            <div className="flex items-center gap-1.5">
              <span className="w-2.5 h-2.5 rounded-full bg-amber-500 shadow-sm shadow-amber-500/50"></span>
              <span className="text-slate-300 font-medium">In Use</span>
            </div>
            <div className="flex items-center gap-1.5">
              <span className="w-2.5 h-2.5 rounded-full bg-rose-500 shadow-sm shadow-rose-500/50"></span>
              <span className="text-slate-300 font-medium">Offline</span>
            </div>
          </div>
        </div>
      );
    }

  // Handle Registration Submit via POST /api/register
  const handleRegisterSubmit = async (e) => {
    if (e) e.preventDefault();
    setRegError("");

    if (!regFullName.trim()) {
      setRegError("Please enter your full name.");
      return;
    }

    if (!regEmail.trim()) {
      setRegError("Please enter your email address.");
      return;
    }

    const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
    if (!emailRegex.test(regEmail.trim())) {
      setRegError("Please enter a valid email address (e.g. name@example.com).");
      return;
    }

    if (!regPhone.trim()) {
      setRegError("Please enter your 10-digit mobile number.");
      return;
    }

    const cleanPhone = regPhone.toString().replace(/\D/g, '').slice(-10);
    if (cleanPhone.length !== 10) {
      setRegError("Please enter a valid 10-digit mobile number (e.g. 9876543210).");
      return;
    }

    if (!regPassword) {
      setRegError("Please create a password (minimum 6 characters).");
      return;
    }

    if (regPassword.length < 6) {
      setRegError("Password must be at least 6 characters long.");
      return;
    }

    if (!regConfirmPassword) {
      setRegError("Please re-enter your password to confirm.");
      return;
    }

    if (regPassword !== regConfirmPassword) {
      setRegError("Passwords do not match. Please ensure both password fields are identical.");
      return;
    }

    const parts = regFullName.trim().split(" ");
    const firstName = parts[0];
    const lastName = parts.slice(1).join(" ") || "";

    setIsRegistering(true);

    try {
      const res = await fetch('/api/register', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          firstName,
          lastName,
          email: regEmail.trim(),
          city: regCity || 'Delhi-NCR',
          phone: cleanPhone,
          role: regRole === 'host' ? 'charger_host' : 'driver', // Strictly 'driver' or 'charger_host'
          password: regPassword,
          confirmPassword: regConfirmPassword,
          businessName: regRole === 'host' ? regBusinessName.trim() : undefined,
          address: regRole === 'host' ? regAddress.trim() : undefined,
          pincode: regRole === 'host' ? regPincode.trim() : undefined
        })
      });

      const data = await res.json();
      setIsRegistering(false);

      if (!res.ok || !data.success) {
        setRegError(data.message || 'Registration failed. Please check your information.');
        return;
      }

      localStorage.setItem('evs_auth_token', data.token);
      setAuthToken(data.token);
      setIsLoggedIn(true);
      const mappedRole = data.user.role === 'charger_host' ? 'host' : data.user.role;
      setUserRole(mappedRole);
      setUserProfile(prev => ({
        ...prev,
        id: data.user.id,
        name: data.user.name || `${data.user.firstName || ''} ${data.user.lastName || ''}`.trim(),
        firstName: data.user.firstName || '',
        lastName: data.user.lastName || '',
        email: data.user.email,
        city: data.user.city || 'Delhi-NCR',
        phone: data.user.phone ? `+91 ${data.user.phone}` : ''

      if (speedFilter === 'fast-ac' && (ch.powerKw <= 3.6 || ch.powerKw > 25)) return false;
      if (speedFilter === 'fast-dc' && ch.powerKw < 25) return false;
      if (socketFilter !== 'all') {

        if (socketFilter === 'ccs2' && !ch.socketType.includes('CCS-2') && !ch.socketType.includes('CCS2')) return false;
        if (socketFilter === '15a' && !ch.socketType.includes('15A')) return false;
        if (socketFilter === 'chademo' && !ch.socketType.includes('CHAdeMO')) return false;
        if (socketFilter === 'gbt' && !ch.socketType.includes('GB/T')) return false;
      }
      if (ch.pricePerHour > maxPrice) return false;
      if (minRating > 0 && ch.hostRating < minRating) return false;

      return true;
    }).sort((a, b) => {
      if (sortBy === 'nearest') return (a.distanceKm || 0) - (b.distanceKm || 0);
      if (sortBy === 'price-asc') return a.pricePerHour - b.pricePerHour;
      if (sortBy === 'rating-desc') return b.hostRating - a.hostRating;
      if (sortBy === 'speed-desc') return b.powerKw - a.powerKw;

    });

    return {

                            type="text"
                            value={regAddress}
                            onChange={(e) => setRegAddress(e.target.value)}
                            className="w-full bg-slate-950 border border-slate-700 p-2.5 rounded-xl text-white focus:outline-none focus:border-emerald-500"
                            placeholder="e.g. Bellandur Main Road"
                          />
                        </div>
                        <div>
                          <label className="block text-slate-300 font-semibold mb-1">PIN Code</label>
                          <input
                            type="text"
                            maxLength={6}
                            value={regPincode}
                            onChange={(e) => setRegPincode(e.target.value.replace(/\D/g, ''))}
                            className="w-full bg-slate-950 border border-slate-700 p-2.5 rounded-xl text-white font-mono focus:outline-none focus:border-emerald-500"
                            placeholder="560103"
                          />
                        </div>
                      </div>
                    )}

                    {/* Password & Confirm Password */}
                    <div className="grid grid-cols-2 gap-2">
                      <div>
                        <label className="block text-slate-300 font-semibold mb-1">Password *</label>
                        <div className="relative">
                          <input
                            type={showRegPassword ? "text" : "password"}
                            value={regPassword}
                            onChange={(e) => setRegPassword(e.target.value)}
                            className="w-full bg-slate-950 border border-slate-700 p-2.5 pr-8 rounded-xl text-white font-mono focus:outline-none focus:border-emerald-500"
                            placeholder="Min 6 chars"
                            required
                          />
                          <button
                            type="button"
                            onClick={() => setShowRegPassword(!showRegPassword)}
                            className="absolute inset-y-0 right-0 pr-2.5 flex items-center text-slate-500 hover:text-slate-300"
                          >
                            <i className={`fa-solid ${showRegPassword ? 'fa-eye-slash' : 'fa-eye'} text-[10px]`}></i>
                          </button>
                        </div>
                      </div>

                      <div>
                        <label className="block text-slate-300 font-semibold mb-1">Confirm Password *</label>
                        <input
                          type={showRegPassword ? "text" : "password"}
                          value={regConfirmPassword}
                          onChange={(e) => setRegConfirmPassword(e.target.value)}
                          className="w-full bg-slate-950 border border-slate-700 p-2.5 rounded-xl text-white font-mono focus:outline-none focus:border-emerald-500"
                          placeholder="Re-enter password"
                          required
                        />
                      </div>
                    </div>

                    {/* Error Banner */}
                    {regError && (
                      <div className="p-3 rounded-xl bg-rose-950/85 border border-rose-700 text-rose-200 text-xs space-y-1">
                        <div className="flex items-center gap-2 font-bold">
                          <i className="fa-solid fa-circle-exclamation text-rose-400 text-sm flex-shrink-0"></i>
                          <span>{regError}</span>
                        </div>
                        {regError.toLowerCase().includes('already exists') && (
                          <button
                            type="button"
                            onClick={() => {
                              setAuthTab("login");
                              setLoginInput(regEmail || regPhone);
                              setRegError("");
                              setLoginError("");
                            }}
                            className="text-[11px] text-emerald-400 hover:text-emerald-300 font-bold underline block pt-1"
                          >
                            Sign In with this account →
                          </button>
                        )}
                      </div>
                    )}

                    <div className="text-[10px] text-slate-500 leading-tight">
                      By registering, you agree to EV-Share Terms of Service, EV Driver Etiquette, and Host Community Guidelines.
                    </div>

                    <button
                      type="submit"
                      disabled={isRegistering}
                      className="w-full py-3 rounded-xl bg-gradient-to-r from-emerald-500 to-teal-400 hover:from-emerald-600 hover:to-teal-500 text-slate-950 font-extrabold text-xs shadow-lg shadow-emerald-500/25 transition flex items-center justify-center gap-2 cursor-pointer"
                    >
                      {isRegistering ? (
                        <>
                          <i className="fa-solid fa-spinner animate-spin"></i>
                          <span>Creating Your Account...</span>
                        </>
                      ) : (
                        <span>Create {regRole === 'host' ? 'Charger Host' : 'EV Driver'} Account</span>
                      )}
                    </button>

                    <div className="text-center pt-1 text-slate-400 text-xs">
                      Already have an account?{' '}
                      <button
                        type="button"
                        onClick={() => { setAuthTab("login"); setLoginError(""); setRegError(""); }}
                        className="text-emerald-400 hover:text-emerald-300 font-bold ml-1 transition"
                      >
                        Sign In
                      </button>
                    </div>
                  </form>
                )}

              </div>
            </div>
          )}

          {/* ========================================================================= */}
          {/* 4. MODERN STARTUP FOOTER */}
          {/* ========================================================================= */}
          <footer className="bg-[#05080C] border-t border-slate-800 text-slate-400 text-xs py-12">
            <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
              <div className="grid grid-cols-1 md:grid-cols-4 gap-8 mb-8">
                <div className="space-y-3">
                  <div className="flex items-center gap-2">
                    <i className="fa-solid fa-bolt-lightning text-emerald-400 text-lg"></i>
                    <span className="text-base font-extrabold text-white">EV-Share</span>
                  </div>
                  <p className="text-slate-400 leading-relaxed text-[11px]">
                    Pan-India Peer-to-Peer EV Charging Network powering clean electric mobility across 75+ Indian cities.
                  </p>
                  <div className="flex gap-3 text-slate-400 pt-1">
                    <i className="fa-brands fa-twitter hover:text-emerald-400 cursor-pointer"></i>
                    <i className="fa-brands fa-linkedin hover:text-emerald-400 cursor-pointer"></i>
                    <i className="fa-brands fa-instagram hover:text-emerald-400 cursor-pointer"></i>
                    <i className="fa-brands fa-github hover:text-emerald-400 cursor-pointer"></i>
                  </div>
                </div>

                <div>
                  <h4 className="text-white font-bold mb-3 uppercase tracking-wider text-[11px] font-mono">Platform</h4>
                  <ul className="space-y-2">
                    <li><button onClick={() => setActivePage("find-chargers")} className="hover:text-white">Find Chargers Map</button></li>
                    <li><button onClick={() => setActivePage("list-charger")} className="hover:text-white">List Your Socket</button></li>
                    <li><button onClick={() => setActivePage("dashboard")} className="hover:text-white">Driver Dashboard</button></li>
                    <li><button onClick={() => setActivePage("owner-dashboard")} className="hover:text-white">Host Hub & Payouts</button></li>
                  </ul>
                </div>

                <div>
                  <h4 className="text-white font-bold mb-3 uppercase tracking-wider text-[11px] font-mono">Trust & Safety</h4>
                  <ul className="space-y-2">
                    <li className="hover:text-white cursor-pointer">₹5 Lakh Host Guarantee</li>
                    <li className="hover:text-white cursor-pointer">Verified Host Badges</li>
                    <li className="hover:text-white cursor-pointer">Cancellation & Refund Policy</li>
                    <li className="hover:text-white cursor-pointer">Report an Issue</li>
                  </ul>
                </div>

                <div>
                  <h4 className="text-white font-bold mb-3 uppercase tracking-wider text-[11px] font-mono">24/7 Roadside Support</h4>
                  <p className="text-[11px] text-slate-400 mb-2">Dedicated helpline for drivers & hosts across India:</p>
                  <div className="font-mono text-sm font-bold text-emerald-400 mb-3">1800-EV-SHARE (Toll Free)</div>
                  <span className="text-[10px] text-slate-500 font-mono">support@evshare.in</span>
                </div>
              </div>

              <div className="pt-8 border-t border-slate-800/80 text-center text-slate-500 text-[11px] flex flex-col sm:flex-row justify-between items-center gap-2">
                <span>© 2026 EV-Share Technologies Pvt Ltd. All rights reserved.</span>
                <span className="font-mono text-slate-500">Made for India's Electric Future ⚡</span>
              </div>
            </div>
          </footer>

        </div>
      );
    }

    // Render the React 18 Application
    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
